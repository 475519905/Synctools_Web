<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SyncTools QQ登录隐私说明</title><link rel="stylesheet" href="styles.css?v=qq20261127"><main class="wrap" style="padding:48px 20px"><h1>QQ 登录隐私说明</h1><p>QQ 登录由腾讯 QQ 互联提供，密码仅在腾讯官方页面输入。本网站仅请求登录所需的 QQ 昵称、头像和应用内身份标识，用于建立和维持登录状态；服务端保存经不可逆 HMAC 处理的身份标识、昵称、头像地址和会话摘要，不长期存储 QQ 授权令牌。</p><p>登录会话最长保留7天；可在用户中心退出。QQ 登录不自动授予订单、下载或插件激活权益。除提供服务所必需的服务器及腾讯授权接口外，不出售或用于广告分享您的登录资料。申请查询或删除登录资料，请联系 support@synctools.cn 并完成身份核验。</p><p>网站运营者：陈旭东。更新日期：2026年11月27日。</p><a href="Account.html">返回用户中心</a></main></html>
